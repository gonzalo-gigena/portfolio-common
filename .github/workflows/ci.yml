name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: the restore drill proves the backups still restore
  workflow_dispatch:

jobs:
  fakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: for f in scripts/*.sh test/*.sh; do sh -n "$f"; done
      - name: Migration lint accepts good, rejects bad
        run: |
          sh scripts/check-migrations.sh test/migrations/good
          ! sh scripts/check-migrations.sh test/migrations/bad
      - name: Fakes end-to-end test
        run: docker compose -f test/compose.yaml --profile fakes run --rm --build test
      - name: Tear down
        if: always()
        run: docker compose -f test/compose.yaml --profile fakes down -v

  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Seed, back up, write more, restore to a point in between, measure RPO/RTO
        run: sh test/pitr.sh
