# Backup/restore drill test (B3): sh test/pitr.sh
name: pitr-test
services:
  db:
    extends: { file: ../../backup/compose.yaml, service: db-pitr }
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 20
volumes:
  pgbackrest:
