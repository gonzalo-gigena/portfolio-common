# Catches every email locally. Apps send to smtp://mailpit:1025; read them at http://localhost:8025.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.34.0
    profiles: [fakes]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    mem_limit: 128m
    restart: unless-stopped
